<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottofondo composer comparison</title>
<style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#17171c;color:#ddd}label,button{margin-right:1rem}select,input,button{font:inherit}input{width:7rem}article{margin:2rem 0}audio{width:100%}iframe{display:none}a{color:inherit}</style>
<h1>Composer comparison</h1>
<p>Compare the new acid phrasing with the previous composer, or compare other genres with Strudel v1. You can also listen to six original studies. Fixed master gain; no normalisation. Acid comparisons span sixteen bars at the same tempo.</p>
<label>Genre <select id="genre"><option>acid</option><option>techno</option><option>house</option></select></label>
<label>Seed (hex) <input id="seed" value="1"></label>
<label>Section <select id="section"><option>opening</option><option>development</option><option>transition</option></select></label>
<p><label>Study <select id="study"><option value="">Generated comparison</option></select></label></p>
<p><button id="render">Render comparison</button><button id="reveal">Reveal versions</button></p>
<p id="status" role="status"></p><main id="clips"></main>
<script type="module" src="/tools/composer.ts"></script></html>
